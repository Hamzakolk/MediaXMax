name: Build Media X Max APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create the Android project files
        run: flutter create --platforms=android --org com.mediax --project-name media_x_max .

      - name: Background audio service, MainActivity and permissions
        run: |
          python3 - << 'PY'
          import pathlib, re
          base = pathlib.Path("android/app/src/main/kotlin")
          for old in base.rglob("MainActivity.kt"):
              old.unlink()
          pkg_dir = base / "com" / "mediax" / "media_x_max"
          pkg_dir.mkdir(parents=True, exist_ok=True)
          (pkg_dir / "MainActivity.kt").write_text(
              "package com.mediax.media_x_max\n\n"
              "import com.ryanheise.audioservice.AudioServiceActivity\n\n"
              "class MainActivity : AudioServiceActivity()\n",
              encoding="utf-8")
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = mf.read_text(encoding="utf-8")
          perms = (
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r"\1\n    " + perms, s, count=1)
          services = (
              '<service android:name="com.ryanheise.audioservice.AudioService" '
              'android:foregroundServiceType="mediaPlayback" android:exported="true">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.media.browse.MediaBrowserService" />\n'
              '            </intent-filter>\n'
              '        </service>\n'
              '        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.MEDIA_BUTTON" />\n'
              '            </intent-filter>\n'
              '        </receiver>\n    '
          )
          if "com.ryanheise.audioservice.AudioService" not in s:
              s = s.replace("</application>", services + "</application>", 1)
          mf.write_text(s, encoding="utf-8")
          print("manifest and MainActivity updated")
          PY

      - name: Allow internet and plain http streams
        run: |
          python3 - << 'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', s, count=1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - run: flutter pub get

      - name: Add missing namespace to old plugins
        run: |
          python3 - << 'PY'
          import glob, os, re, pathlib
          home = os.path.expanduser("~")
          for gradle in glob.glob(f"{home}/.pub-cache/hosted/pub.dev/*/android/build.gradle*"):
              g = pathlib.Path(gradle)
              text = g.read_text(encoding="utf-8")
              if re.search(r"^\s*namespace\b", text, re.M):
                  continue
              manifest = g.parent / "src" / "main" / "AndroidManifest.xml"
              if not manifest.exists():
                  continue
              m = re.search(r'package="([^"]+)"', manifest.read_text(encoding="utf-8"))
              if not m:
                  continue
              pkg = m.group(1)
              line = f'namespace = "{pkg}"' if g.suffix == ".kts" else f'namespace "{pkg}"'
              text, n = re.subn(r"^(\s*)android\s*\{", lambda mm: mm.group(0) + "\n" + mm.group(1) + "    " + line, text, count=1, flags=re.M)
              if n:
                  g.write_text(text, encoding="utf-8")
                  print("namespace added to", gradle, pkg)
          PY

      - name: Force Java 17 and Kotlin 17 on all modules
        run: |
          python3 - << 'PY'
          import pathlib
          groovy_block = """
          subprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
                  p.tasks.matching { it.name.endsWith('Kotlin') }.configureEach {
                      kotlinOptions { jvmTarget = '17' }
                  }
              }
          }
          """
          kts_block = """
          subprojects {
              afterEvaluate {
                  extensions.findByName("android")?.let { ext ->
                      (ext as com.android.build.gradle.BaseExtension).compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
                  tasks.matching { it.name.endsWith("Kotlin") }.configureEach {
                      (this as org.jetbrains.kotlin.gradle.tasks.KotlinCompile).kotlinOptions.jvmTarget = "17"
                  }
              }
          }
          """
          g = pathlib.Path("android/build.gradle")
          k = pathlib.Path("android/build.gradle.kts")
          if g.exists():
              g.write_text(g.read_text(encoding="utf-8") + groovy_block, encoding="utf-8")
              print("patched android/build.gradle")
          elif k.exists():
              k.write_text(k.read_text(encoding="utf-8") + kts_block, encoding="utf-8")
              print("patched android/build.gradle.kts")
          PY

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MediaXMax-apk
          path: build/app/outputs/flutter-apk/app-release.apk
