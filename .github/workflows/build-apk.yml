name: Build Media X Max APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create the Android project files
        run: flutter create --platforms=android --org com.mediax --project-name media_x_max .

      - name: Write MainActivity (media scan + background audio)
        run: |
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/mediax/media_x_max
          cat > android/app/src/main/kotlin/com/mediax/media_x_max/MainActivity.kt << 'KT'
          package com.mediax.media_x_max

          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.concurrent.Executors

          class MainActivity : AudioServiceActivity() {
              private val executor = Executors.newSingleThreadExecutor()
              private val main = Handler(Looper.getMainLooper())

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mediaxmax/scan")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "scan") {
                              executor.execute {
                                  try {
                                      val items = scanMedia()
                                      main.post { result.success(items) }
                                  } catch (e: Exception) {
                                      main.post { result.error("SCAN_FAILED", e.message, null) }
                                  }
                              }
                          } else {
                              result.notImplemented()
                          }
                      }
              }

              private fun scanMedia(): List<Map<String, Any>> {
                  val out = ArrayList<Map<String, Any>>()
                  queryTable(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, "audio", out)
                  queryTable(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, "video", out)
                  return out
              }

              private fun queryTable(uri: Uri, kind: String, out: MutableList<Map<String, Any>>) {
                  val projection = arrayOf(
                      MediaStore.MediaColumns.DATA,
                      MediaStore.MediaColumns.TITLE,
                      MediaStore.MediaColumns.SIZE
                  )
                  contentResolver.query(uri, projection, null, null, null)?.use { c ->
                      val dataCol = c.getColumnIndexOrThrow(MediaStore.MediaColumns.DATA)
                      val titleCol = c.getColumnIndexOrThrow(MediaStore.MediaColumns.TITLE)
                      val sizeCol = c.getColumnIndexOrThrow(MediaStore.MediaColumns.SIZE)
                      while (c.moveToNext()) {
                          val path = c.getString(dataCol) ?: continue
                          out.add(mapOf(
                              "path" to path,
                              "title" to (c.getString(titleCol) ?: path.substringAfterLast('/')),
                              "size" to c.getLong(sizeCol),
                              "kind" to kind
                          ))
                      }
                  }
              }

              override fun onDestroy() {
                  executor.shutdown()
                  super.onDestroy()
              }
          }
          KT

      - name: Permissions and background service in the manifest
        run: |
          python3 - << 'PY'
          import pathlib, re
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = mf.read_text(encoding="utf-8")
          perms = (
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    '
          )
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r"\1\n    " + perms, s, count=1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          services = (
              '<service android:name="com.ryanheise.audioservice.AudioService" '
              'android:foregroundServiceType="mediaPlayback" android:exported="true">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.media.browse.MediaBrowserService" />\n'
              '            </intent-filter>\n'
              '        </service>\n'
              '        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.MEDIA_BUTTON" />\n'
              '            </intent-filter>\n'
              '        </receiver>\n    '
          )
          if "com.ryanheise.audioservice.AudioService" not in s:
              s = s.replace("</application>", services + "</application>", 1)
          mf.write_text(s, encoding="utf-8")
          print("manifest updated")
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MediaXMax-apk
          path: build/app/outputs/flutter-apk/app-release.apk
