name: Build Media X Max APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create the Android project files
        run: flutter create --platforms=android --project-name media_x_max .

      - name: Set compileSdk to 36
        run: |
          python3 - << 'PY'
          import re, pathlib
          for p in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              f = pathlib.Path(p)
              if not f.exists():
                  continue
              lines = f.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  if re.match(r"^\s*compileSdk(Version)?\s*(=\s*)?.*$", line):
                      indent = re.match(r"^(\s*)", line).group(1)
                      line = f"{indent}compileSdk = 36"
                  out.append(line)
              f.write_text("\n".join(out) + "\n", encoding="utf-8")
              print("=== " + p)
              for line in out:
                  if "compileSdk" in line:
                      print(line)
          PY

      - name: Allow internet and plain http streams
        run: |
          python3 - << 'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', s, count=1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MediaXMax-apk
          path: build/app/outputs/flutter-apk/app-release.apk
