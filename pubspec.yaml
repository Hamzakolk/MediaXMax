publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.10
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  file_picker: ^10.3.2
  http: ^1.2.2
